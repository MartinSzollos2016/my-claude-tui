name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, lint, typecheck, validate, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            .github/tools/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Pinned with integrity hashes in .github/tools/package-lock.json.
      - name: Install Claude Code
        run: |
          npm ci --prefix .github/tools
          echo "$PWD/.github/tools/node_modules/.bin" >> "$GITHUB_PATH"

      # Claude Code writes its plugin API types into .claude-plugin/types/ when
      # it loads the plugin; without credentials it exits right after that.
      - name: Generate plugin API types
        run: |
          claude -p --plugin-dir . noop </dev/null || true
          test -f .claude-plugin/types/claude-code/index.d.ts

      - name: Check
        run: npm run check

      # Istanbul coverage of the logic the unit tests import directly; the
      # engine-mounted render tests cannot be instrumented.
      - name: Coverage
        run: |
          npm run coverage
          node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"

  audit:
    name: Dependency and secret audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: npm audit
        run: npm audit --audit-level=moderate

      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.0 \
            git /repo --no-banner --redact --exit-code 1
